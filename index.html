<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RouteOptimize Fleet Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">

<div class="login-card">

<h1>RouteOptimize</h1>

<input id="login-email" type="text" placeholder="Email (admin@demo.com)">
<input id="login-password" type="password" placeholder="Password (password123)">

<button onclick="login()">Login</button>

</div>

</div>


<!-- DASHBOARD -->
<div id="dashboard-screen" class="screen">

<nav class="top-nav">

<div class="nav-title">RouteOptimize</div>

<div class="nav-user">
<span id="user-role">Dispatcher</span>
<button onclick="logout()">Logout</button>
</div>

</nav>


<div class="main-layout">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Route</h3>

<input id="pickup-input" placeholder="Pickup location">

<input id="destination-input" placeholder="Destination">

<button onclick="optimizeRoute()">Optimize Route</button>

<button onclick="saveDispatch()">Dispatch Vehicle</button>

<hr>

<h3>Vehicle</h3>

<select id="vehicle-select">
<option>Standard Van</option>
<option>Box Truck</option>
<option>Motorcycle</option>
</select>

<hr>

<h3>Dispatch History</h3>

<div id="history-list"></div>

</div>


<!-- MAP -->
<div class="map-area">

<div id="map"></div>

</div>

</div>

</div>



<!-- GOOGLE MAPS -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places&callback=initMap">
</script>

<script src="app.js"></script>

</body>
</html>
